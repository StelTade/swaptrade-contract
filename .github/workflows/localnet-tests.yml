name: Localnet Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
  SOROBAN_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"

jobs:
  localnet-tests:
    name: Soroban Localnet Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      stellar:
        image: stellar/quickstart:soroban-dev
        ports:
          - 8000:8000
        options: >-
          --name stellar
          --health-cmd "curl -f http://localhost:8000 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Soroban CLI
        run: cargo install --locked --git https://github.com/stellar/soroban-tools --tag v27.0.2 soroban-cli

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-localnet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-localnet-

      - name: Wait for Stellar node
        run: |
          echo "Waiting for Stellar node to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000 > /dev/null 2>&1; then
              echo "Stellar node is ready!"
              break
            fi
            echo "Attempt $i/30 - waiting 5s..."
            sleep 5
          done

      - name: Generate identity for testing
        run: |
          soroban keys generate --network standalone --output json test-admin > /dev/null 2>&1 || true
          soroban keys generate --network standalone --output json test-user-1 > /dev/null 2>&1 || true
          soroban keys generate --network standalone --output json test-user-2 > /dev/null 2>&1 || true
          echo "Test identities generated"

      - name: Build contracts for WASM
        run: |
          cargo build --manifest-path swaptrade-contracts/counter/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Deploy contracts to localnet
        run: |
          echo "Deploying counter contract..."
          WASM_PATH="target/wasm32-unknown-unknown/release/counter.wasm"
          if [ -f "$WASM_PATH" ]; then
            CONTRACT_ID=$(soroban contract deploy \
              --wasm "$WASM_PATH" \
              --network standalone \
              --source test-admin 2>&1 || echo "deploy_skipped")
            echo "Contract deployed: $CONTRACT_ID"
          else
            echo "WASM not found at $WASM_PATH, skipping deployment"
          fi

      - name: Run localnet integration tests
        run: |
          cargo test \
            --manifest-path swaptrade-contracts/counter/Cargo.toml \
            --test formal_verification_tests \
            formal_verification \
            -- --nocapture --test-threads=1

      - name: Run cross-crate smoke tests
        run: |
          cargo test \
            --manifest-path swaptrade-contracts/tests/Cargo.toml \
            --test smoke_tests \
            -- --nocapture 2>/dev/null || echo "Smoke tests skipped (may need workspace config)"

      - name: Run scenario-based integration tests
        run: |
          cargo test \
            --manifest-path swaptrade-contracts/counter/Cargo.toml \
            --test trading_comprehensive_test \
            -- --nocapture --test-threads=1

      - name: Gas cost report
        run: |
          echo "=== Gas Cost Report ==="
          cargo bench --workspace 2>&1 | tee localnet-gas-report.txt || echo "Benchmarks completed with warnings"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localnet-test-results
          path: |
            localnet-gas-report.txt
          retention-days: 14
